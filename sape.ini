; SAPE - San Andreas Performance Engine configuration
; Place next to sape.asi (the INI and log are named after the DLL file).
; A missing file is recreated with these defaults.
;
; Every OPTIMIZATION defaults to OFF until it has published benchmark results.
; See docs/optimizations/ for what each switch changes and its risks.

[general]
; error | warn | info | debug
log_level = info

[monitor]
; 0 = off (no hooks at all)
; 1 = frame time only (hooks Present + Reset; lowest overhead)
; 2 = full: also counts draw calls, state changes, texture/buffer creation
level = 1
; Summary line written to sape.log every N ms
summary_interval_ms = 5000
; Start the per-frame CSV capture immediately (otherwise use the hotkey)
capture_on_start = 0
; Spike = frame time > max(spike_min_ms, spike_factor * rolling median of 120 frames)
spike_factor = 2.5
spike_min_ms = 25
log_spikes = 1

[state_filter]
; Optimization 0001: redundant D3D9 state-change filtering.
; enabled = install the state-tracking hooks (also gives redundancy statistics)
; filter  = actually skip redundant calls (0 = measure only)
enabled = 0
filter = 0
render_states = 1
sampler_states = 1
texture_stage_states = 1
; Benchmark helper: while capturing, flip the filter every N seconds (0 = off).
; Produces interleaved ON/OFF samples from the same scene for sape-analyze.
ab_interval_s = 0
; Compatibility test mode: verify every skipped call against the real device.
; Any mismatch disables filtering for the session and is logged. Slower.
validate = 0

[resources]
; Track texture/vertex/index buffer creation and live texture memory estimate.
track = 0

[hotkeys]
enabled = 1
; Require Ctrl+Shift with the keys below (avoids conflicts with SA-MP F-keys)
require_ctrl_shift = 1
; Virtual-key codes: 0x79 = F10, 0x7A = F11, 0x7B = F12
toggle_capture = 0x79
toggle_filter = 0x7A
dump_summary = 0x7B

[compat]
; If Direct3D was created before SAPE loaded, attach through RenderWare's
; device pointer (gta_sa.exe 1.0 US only; validated before use).
late_attach = 1
; Run D3D9-level features on an unrecognised executable (no game-memory access
; is performed on unknown versions regardless of this setting).
allow_unknown_exe = 1

[proxy]
; Only used when SAPE is installed as d3d9.dll (next to gta_sa.exe).
; Empty = forward to the system d3d9.dll. To combine with another d3d9 mod
; (ReShade, DXVK, ENB...), rename that mod's d3d9.dll (e.g. d3d9_reshade.dll)
; and put its file name here:
chain =
