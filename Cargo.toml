[workspace]
resolver = "2"
members = ["crates/sape-core", "crates/sape", "tools/sape-analyze"]

[workspace.package]
version = "0.1.2"
edition = "2021"
license = "MIT"
rust-version = "1.81"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = "line-tables-only"   # keeps symbolised crash dumps possible
strip = false

[profile.dev]
panic = "abort"
